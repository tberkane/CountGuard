site_name: CountGuard
site_description: Audit and protect aggregate patient-count releases against reconstruction attacks
site_url: https://tberkane.github.io/CountGuard/
repo_url: https://github.com/tberkane/CountGuard
repo_name: tberkane/CountGuard
copyright: Copyright 2026 Thomas Berkane. Apache License 2.0.

theme:
  name: material
  features:
    - navigation.sections
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle: {icon: material/brightness-7, name: Dark mode}
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle: {icon: material/brightness-4, name: Light mode}

nav:
  - Home: index.md
  - Quickstart: quickstart.md
  - Concepts: concepts.md
  - Mechanisms: mechanisms.md
  - CLI: cli.md
  - API reference: api.md

markdown_extensions:
  - admonition
  - tables
  - toc: {permalink: true}
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.arithmatex: {generic: true}

extra_javascript:
  - https://cdn.jsdelivr.net/npm/mathjax@3.2.2/es5/tex-mml-chtml.js

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            show_source: false
            show_root_heading: true
            show_root_full_path: false
            members_order: source
            docstring_style: google
            filters: ["!^_"]
            heading_level: 3
